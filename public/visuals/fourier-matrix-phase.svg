<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fourier matrix phase heatmap</title>
  <desc id="desc">An 8 by 8 phase heatmap showing periodic color patterns in a Fourier matrix.</desc>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <path d="M120 120H1080M120 240H1080M120 360H1080M120 480H1080M120 600H1080M240 80V640M480 80V640M720 80V640M960 80V640" stroke="#DBE7F3"/>
  <g transform="translate(330 90)">
    <rect x="0" y="0" width="540" height="540" rx="12" fill="#F8FBFF" stroke="#DBE7F3" stroke-width="3"/>
    <g transform="translate(30 30)">
      <rect x="0" y="0" width="60" height="60" fill="#1D4ED8"/><rect x="60" y="0" width="60" height="60" fill="#1D4ED8"/><rect x="120" y="0" width="60" height="60" fill="#1D4ED8"/><rect x="180" y="0" width="60" height="60" fill="#1D4ED8"/><rect x="240" y="0" width="60" height="60" fill="#1D4ED8"/><rect x="300" y="0" width="60" height="60" fill="#1D4ED8"/><rect x="360" y="0" width="60" height="60" fill="#1D4ED8"/><rect x="420" y="0" width="60" height="60" fill="#1D4ED8"/>
      <rect x="0" y="60" width="60" height="60" fill="#1D4ED8"/><rect x="60" y="60" width="60" height="60" fill="#0F766E"/><rect x="120" y="60" width="60" height="60" fill="#B7791F"/><rect x="180" y="60" width="60" height="60" fill="#B4233A"/><rect x="240" y="60" width="60" height="60" fill="#6D28D9"/><rect x="300" y="60" width="60" height="60" fill="#1E3A8A"/><rect x="360" y="60" width="60" height="60" fill="#15803D"/><rect x="420" y="60" width="60" height="60" fill="#1D4ED8"/>
      <rect x="0" y="120" width="60" height="60" fill="#1D4ED8"/><rect x="60" y="120" width="60" height="60" fill="#B7791F"/><rect x="120" y="120" width="60" height="60" fill="#6D28D9"/><rect x="180" y="120" width="60" height="60" fill="#15803D"/><rect x="240" y="120" width="60" height="60" fill="#1D4ED8"/><rect x="300" y="120" width="60" height="60" fill="#B7791F"/><rect x="360" y="120" width="60" height="60" fill="#6D28D9"/><rect x="420" y="120" width="60" height="60" fill="#15803D"/>
      <rect x="0" y="180" width="60" height="60" fill="#1D4ED8"/><rect x="60" y="180" width="60" height="60" fill="#B4233A"/><rect x="120" y="180" width="60" height="60" fill="#15803D"/><rect x="180" y="180" width="60" height="60" fill="#0F766E"/><rect x="240" y="180" width="60" height="60" fill="#6D28D9"/><rect x="300" y="180" width="60" height="60" fill="#1D4ED8"/><rect x="360" y="180" width="60" height="60" fill="#B4233A"/><rect x="420" y="180" width="60" height="60" fill="#15803D"/>
      <rect x="0" y="240" width="60" height="60" fill="#1D4ED8"/><rect x="60" y="240" width="60" height="60" fill="#6D28D9"/><rect x="120" y="240" width="60" height="60" fill="#1D4ED8"/><rect x="180" y="240" width="60" height="60" fill="#6D28D9"/><rect x="240" y="240" width="60" height="60" fill="#1D4ED8"/><rect x="300" y="240" width="60" height="60" fill="#6D28D9"/><rect x="360" y="240" width="60" height="60" fill="#1D4ED8"/><rect x="420" y="240" width="60" height="60" fill="#6D28D9"/>
      <rect x="0" y="300" width="60" height="60" fill="#1D4ED8"/><rect x="60" y="300" width="60" height="60" fill="#1E3A8A"/><rect x="120" y="300" width="60" height="60" fill="#B7791F"/><rect x="180" y="300" width="60" height="60" fill="#1D4ED8"/><rect x="240" y="300" width="60" height="60" fill="#6D28D9"/><rect x="300" y="300" width="60" height="60" fill="#0F766E"/><rect x="360" y="300" width="60" height="60" fill="#B4233A"/><rect x="420" y="300" width="60" height="60" fill="#15803D"/>
      <rect x="0" y="360" width="60" height="60" fill="#1D4ED8"/><rect x="60" y="360" width="60" height="60" fill="#15803D"/><rect x="120" y="360" width="60" height="60" fill="#6D28D9"/><rect x="180" y="360" width="60" height="60" fill="#B4233A"/><rect x="240" y="360" width="60" height="60" fill="#1D4ED8"/><rect x="300" y="360" width="60" height="60" fill="#B7791F"/><rect x="360" y="360" width="60" height="60" fill="#0F766E"/><rect x="420" y="360" width="60" height="60" fill="#1E3A8A"/>
      <rect x="0" y="420" width="60" height="60" fill="#1D4ED8"/><rect x="60" y="420" width="60" height="60" fill="#1D4ED8"/><rect x="120" y="420" width="60" height="60" fill="#15803D"/><rect x="180" y="420" width="60" height="60" fill="#15803D"/><rect x="240" y="420" width="60" height="60" fill="#6D28D9"/><rect x="300" y="420" width="60" height="60" fill="#15803D"/><rect x="360" y="420" width="60" height="60" fill="#1E3A8A"/><rect x="420" y="420" width="60" height="60" fill="#0F766E"/>
      <path d="M0 0H480V480H0V0Z" stroke="#FFFFFF" stroke-width="3"/>
      <g stroke="#FFFFFF" stroke-width="2" opacity="0.7">
        <path d="M60 0V480M120 0V480M180 0V480M240 0V480M300 0V480M360 0V480M420 0V480"/>
        <path d="M0 60H480M0 120H480M0 180H480M0 240H480M0 300H480M0 360H480M0 420H480"/>
      </g>
    </g>
  </g>
  <text x="600" y="680" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#111827">Each cell is a root of unity; color encodes phase and reveals periodic structure.</text>
</svg>
