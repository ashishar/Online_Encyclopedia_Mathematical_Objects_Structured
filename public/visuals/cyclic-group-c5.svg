<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cayley graph of cyclic group C5</title>
  <desc id="desc">Five group elements arranged in a directed cycle, showing repeated application of one generator.</desc>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <path d="M120 120H1080M120 240H1080M120 360H1080M120 480H1080M120 600H1080M240 80V640M480 80V640M720 80V640M960 80V640" stroke="#DBE7F3"/>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L12 7L2 12Z" fill="#0F766E"/>
    </marker>
  </defs>
  <circle cx="600" cy="360" r="215" stroke="#1D4ED8" stroke-width="4" stroke-dasharray="10 12"/>
  <path d="M600 145C725 147 834 222 881 337" stroke="#0F766E" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M881 383C840 504 729 582 604 575" stroke="#0F766E" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M556 567C451 526 385 424 390 312" stroke="#0F766E" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M420 274C492 171 600 145 600 145" stroke="#0F766E" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <g><circle cx="600" cy="145" r="58" fill="#111827"/><text x="600" y="154" font-size="28" font-weight="850" fill="#FFFFFF">e</text></g>
    <g><circle cx="805" cy="294" r="58" fill="#1D4ED8"/><text x="805" y="303" font-size="28" font-weight="850" fill="#FFFFFF">a</text></g>
    <g><circle cx="727" cy="535" r="58" fill="#0F766E"/><text x="727" y="544" font-size="28" font-weight="850" fill="#FFFFFF">a²</text></g>
    <g><circle cx="473" cy="535" r="58" fill="#B7791F"/><text x="473" y="544" font-size="28" font-weight="850" fill="#FFFFFF">a³</text></g>
    <g><circle cx="395" cy="294" r="58" fill="#B4233A"/><text x="395" y="303" font-size="28" font-weight="850" fill="#FFFFFF">a⁴</text></g>
  </g>
  <text x="600" y="670" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#111827">Repeated multiplication by a moves around the cycle and returns to e.</text>
</svg>
