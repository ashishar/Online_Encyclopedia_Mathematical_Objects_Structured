    <text x="805" y="537" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Quantum</text>
    <text x="805" y="569" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#E6EEFF">states</text>
