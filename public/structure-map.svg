<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mathematical object structure map</title>
  <desc id="desc">A network diagram linking groups, graphs, matrices, functions, algorithms, probability, optimization, quantum objects, and machine learning objects.</desc>
  <rect width="1200" height="720" fill="#F6F7F1"/>
  <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200M0 630H1200M150 0V720M300 0V720M450 0V720M600 0V720M750 0V720M900 0V720M1050 0V720" stroke="#D8DFD5" stroke-width="1"/>
  <g stroke="#146F6B" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <path d="M250 350L430 190L620 280L805 170L955 310"/>
    <path d="M250 350L430 515L620 430L805 545L955 310"/>
    <path d="M430 190L430 515"/>
    <path d="M620 280L620 430"/>
    <path d="M805 170L805 545"/>
    <path d="M430 190L805 545"/>
    <path d="M430 515L805 170"/>
  </g>
  <g>
