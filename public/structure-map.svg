    <text x="250" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">Groups</text>
    <text x="250" y="374" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#D8EDE9">symmetry</text>
  </g>
  <g>
    <circle cx="430" cy="190" r="74" fill="#315FB8"/>
    <text x="430" y="182" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">Graphs</text>
    <text x="430" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#E6EEFF">relations</text>
  </g>
  <g>
    <circle cx="620" cy="280" r="78" fill="#A95F17"/>
    <text x="620" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">Matrices</text>
    <text x="620" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#FFF1DF">linear maps</text>
  </g>
  <g>
    <circle cx="805" cy="170" r="78" fill="#9B3F3B"/>
    <text x="805" y="162" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">Functions</text>
    <text x="805" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#FFE4E0">analysis</text>
  </g>
  <g>
    <circle cx="955" cy="310" r="86" fill="#146F6B"/>
    <text x="955" y="302" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">Algorithms</text>
    <text x="955" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#D8EDE9">computation</text>
  </g>
  <g>
    <circle cx="430" cy="515" r="78" fill="#6F4AB8"/>
    <text x="430" y="507" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Probability</text>
    <text x="430" y="539" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#F0E9FF">uncertainty</text>
