name: OEMO CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate object JSON
        run: npm run validate:objects

      - name: Check content rules
        run: npm run check:content

      - name: Check code snippets
        run: npm run check:snippets

      - name: Build
        run: npm run build
